name: Verify BidMyTicket Mobile UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile:
    name: Build and responsive browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for automated browser tests
        run: npx playwright install --with-deps chromium
      - name: Check Next.js production build
        run: npm run build
      - name: Run six mobile, tablet, desktop viewport tests
        run: npm run test:mobile
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: test-results/
          if-no-files-found: ignore
